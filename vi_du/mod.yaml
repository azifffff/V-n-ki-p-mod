# Gói mod mẫu. Mới làm mod: đọc huong-dan.md và README.md cạnh file này trước.
# Sửa thử rồi nén cả thư mục thành .zip, cài ở Cấu hình → Mods. Đổi `id` bên dưới (và id trong main.js, phải trùng) thành tên mod của bạn.
# Id mới của mod phải là <tiền tố>.<id mod>_<tên>: item.vi_du_…, enemy.vi_du_…, ev.vi_du_…
# Cần mẫu một loại mục: vào game, F12 → Console, gõ tuTien.yaml.find('tên') rồi copy(tuTien.yaml('<id>')) (README.md mục "Lấy mẫu từ game").
id: vi_du
name: Mod Mẫu
version: 1.0.0
api_version: 1
author: Vạn Kiếp Tu Tiên
description: |
  Gói mẫu cho người làm mod: một vật kèm icon, một yêu thú, một sự kiện đánh nhau,
  một dòng patch sửa vật gốc, một bảng CSV (content/bang/), một hằng cân bằng, hai tùy chọn và main.js.

# Sửa từng trường của mục đã có (không chép cả mục): mảng thay hẳn, `0:` sửa phần tử, null xóa trường
patch:
  item.thiet_kiem: { gia: 14 }

# Đổi hằng cân bằng, khóa như balance.md (module.TÊN[.trường])
balance:
  difficulty.DIFFICULTY.enemyHealth: 1

options:
  - key: kho
    label: Rừng trúc hiểm
    hint: Yêu thú trong rừng trúc nhanh hơn.
    type: choice
    default: thuong
    choices:
      - { value: thuong, label: Thường }
      - { value: hiem, label: Hiểm }
    # File chỉ nạp khi chọn giá trị đó
    files:
      hiem: [content/patch/hiem.yaml]
  - key: chao
    label: Chào khi vào game
    type: bool
    default: true

# JS tùy chọn (mặc định main.js nếu có)
script: main.js
